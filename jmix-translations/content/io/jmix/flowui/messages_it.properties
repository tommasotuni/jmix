  corrente
io.jmix.flowui.app.propertyfilter.dateinterval.component/NextLastIntervalField.includingCurrentHelperBtn.messageDialog.content = <div>\
  <p>\
     L'opzione "incluso corrente" non sposta l'intervallo risultante. Ad esempio, se l'intervallo \
     selezionato è gli ultimi due giorni e l'opzione "incluso corrente" non viene utilizzata per la data <code>'04-MM-yyyy'</code>, \
     allora l'intervallo risultante includerà le seguenti date:\
  </p>\
  <ul>\
     <li>03-MM-yyyy;</li>\
     <li>02-MM-yyyy.</li>\
  </ul>\
  <p>\
     Se l'esempio sopra utilizzerà l'opzione "incluso corrente", allora l'intervallo risultante include le seguenti \
     date:\
  </p>\
  <ul>\
     <li>04-MM-yyyy;</li>\
     <li>03-MM-yyyy;</li>\
     <li>02-MM-yyyy.</li>\
  </ul>\
  <p>\
     La stessa regola funziona per anno, mese, ora e minuto.\
  </p>\
</div>


