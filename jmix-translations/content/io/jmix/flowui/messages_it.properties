io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.joinField.tooltipMessage = <div>Espressione JPQL che verrà aggiunta \
  alla clausola "from" della query del data loader.<br/> \
  Può essere necessaria per creare una condizione basata su un attributo di una collezione correlata.<br><br> \
  L'espressione dovrebbe iniziare con una virgola, istruzioni "join" o "left join".<br/>\
  Usa il placeholder {E} invece dell'alias dell'entità.<br><br>\
  Ad esempio:<br/>\
  <code>join {E}.tags t</code></div>
io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.joinField.helperText=<div> L'espressione dovrebbe iniziare con \
  una virgola, istruzioni "join" o "left join". Ad esempio: </span><code>join {E}.tags t</code></div>
io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.whereField.requiredMessage = Compila il campo "Where"
io.jmix.flowui.app.filter.condition/jpqlFilterConditionDetailView.whereField.tooltipMessage = <div>Espressione JPQL che verrà aggiunta \
  alla clausola "where" della query del data loader. \
  Usa il placeholder {E} invece dell'alias dell'entità.<br><br>\
  La condizione può avere solo un parametro indicato da <b>?</b> se utilizzato.<br/>\
  Inoltre, possono essere utilizzati i seguenti parametri predefiniti:<ul>\
  <li><code>:current_user_&lt;attribute&gt;</code> – un attributo dell'utente corrente.</li>\
  <li><code>:session_&lt;attribute&gt;</code> – un attributo di sessione.</li></ul>\
  Se l'espressione utilizza la clausola <code>like</code>, il valore verrà automaticamente racchiuso in <code>(?i)%value%</code> \
  per fornire la ricerca case-insensitive.<br/>\
  <br/>\
  Esempio di selezione di entità per un attributo della collezione <code>tags</code> unita:<br/>\
  <code>t.name like ?</code></div>

